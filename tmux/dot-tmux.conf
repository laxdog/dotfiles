# Reload last session on boot : https://github.com/tmux-plugins/tmux-continuum
set -g @continuum-boot 'on'
set -g @continuum-restore 'on'


set -g history-limit 50000
setw -g aggressive-resize on
setw -g mode-keys vi

# enable activity alerts
setw -g monitor-activity on
set -g visual-activity on

# number windows from 1
set -g base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# Increase time out for pane selection ( C-b q)
set -g display-panes-time 2000

# Key bindings
bind y set-window-option synchronize-panes
# toggle pane title visibility
bind r if-shell -F '#{==:#{pane-border-status},off}' \
  'set-option -g pane-border-status top' \
  'set-option -g pane-border-status off'
# rename pane
bind t command-prompt -p "(rename-pane)" -I "#T" "select-pane -T '%%'"
# easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window

# Set 256 colors
set -g default-terminal "screen-256color"

set -g pane-border-status top
set -g pane-border-format '#{pane_index} #{pane_title}'

# Keep expensive status plugins from refreshing too often.
set -g status-interval 60

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'
set -g @plugin '27medkamal/tmux-session-wizard'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @dracula-plugins "git network-bandwidth battery cpu-usage ram-usage time"
set -g @dracula-refresh-rate 60
set -g @dracula-git-no-repo-message "Not-a-git-repo"
set -g @dracula-show-powerline true
set -g @dracula-border-contrast true
if-shell 'test "$(uname -s)" = Darwin' \
  'set-option -g @dracula-network-bandwidth en0'
set -g @dracula-network-bandwidth-show-interface true
set -g @dracula-day-month true
set -g @dracula-show-flags true


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' \
  'run-shell "$HOME/.tmux/plugins/tpm/tpm"'
